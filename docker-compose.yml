services:
  roomies:
    container_name: roomies
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5123:5123"
    volumes:
      - ./media:/media:ro
      - ./cache:/cache
      - ./config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Intel/AMD GPU (VAAPI/QSV): uncomment `devices` block below.
    # devices:
    #   - /dev/dri:/dev/dri

    # NVIDIA GPU (NVENC): uncomment `deploy` block below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]
